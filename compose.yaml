name: software-release-governance

services:
  database:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-release_governance}
      POSTGRES_USER: ${POSTGRES_USER:-governance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  application:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-release_governance}
      DATABASE_USERNAME: ${POSTGRES_USER:-governance}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RELEASE_CHECKS_ENABLED: ${RELEASE_CHECKS_ENABLED:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
