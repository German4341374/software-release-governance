<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Deployments · Release Governance</title><link rel="stylesheet" href="/css/site.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><section class="hero compact"><div><p class="eyebrow">Change history</p><h1>Deployments</h1></div></section><section class="panel"><table><thead><tr><th>Product</th><th>Environment</th><th>Version</th><th>Status</th><th>Emergency</th><th>Result</th></tr></thead><tbody><tr th:each="deployment : ${deployments}"><td th:text="${deployment.product}"></td><td th:text="${deployment.environment}"></td><td><code th:text="${deployment.targetVersion}"></code></td><td><span class="badge" th:text="${deployment.status}"></span></td><td th:text="${deployment.emergency}"></td><td><div class="actions" th:if="${deployment.status.name() == 'SCHEDULED' or deployment.status.name() == 'IN_PROGRESS'}"><form method="post" th:action="@{/deployments/{id}/complete(id=${deployment.id})}"><input type="hidden" name="successful" value="true"><button class="button primary">Success</button></form><form method="post" th:action="@{/deployments/{id}/complete(id=${deployment.id})}"><input type="hidden" name="successful" value="false"><input name="failureReason" value="Deployment verification failed"><button class="button danger">Failed</button></form></div></td></tr></tbody></table></section></main></body></html>
