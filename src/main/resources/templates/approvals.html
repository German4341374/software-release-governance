<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Approvals · Release Governance</title><link rel="stylesheet" href="/css/site.css"></head><body><header th:replace="~{fragments :: header}"></header><main class="container"><div th:replace="~{fragments :: messages}"></div><section class="hero compact"><div><p class="eyebrow">Control gate</p><h1>Approvals</h1></div></section><section class="panel"><table><thead><tr><th>Version</th><th>Environment</th><th>Requested by</th><th>Status</th><th>Decision</th></tr></thead><tbody><tr th:each="approval : ${approvals}"><td><code th:text="${approval.version}"></code></td><td th:text="${approval.environment}"></td><td th:text="${approval.requestedBy}"></td><td><span class="badge" th:text="${approval.status}"></span></td><td><div class="actions" th:if="${approval.status.name() == 'PENDING'}"><form method="post" th:action="@{/approvals/{id}/decision(id=${approval.id})}"><input type="hidden" name="decision" value="APPROVED"><button class="button primary">Approve</button></form><form method="post" th:action="@{/approvals/{id}/decision(id=${approval.id})}"><input type="hidden" name="decision" value="REJECTED"><button class="button danger">Reject</button></form></div></td></tr></tbody></table></section></main></body></html>
